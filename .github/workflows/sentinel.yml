name: Sentinel

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: sentinel
        uses: Adityakk9031/jev-build-sentinel@v1
        with:
          jev-api-key: ${{ secrets.JEV_API_KEY }}
          execute-tests: 'true'
          confidence-threshold: '0.7'
      - name: Report
        run: |
          echo "decision: ${{ steps.sentinel.outputs.decision }}"
          echo "risk: ${{ steps.sentinel.outputs.risk_score }}"
          echo "confidence: ${{ steps.sentinel.outputs.confidence }}"
          echo "selected: ${{ steps.sentinel.outputs.selected_tests }}"
          echo "reason: ${{ steps.sentinel.outputs.reason }}"
